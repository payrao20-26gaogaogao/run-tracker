<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跑者无疆</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    background: linear-gradient(160deg, #FFF7ED 0%, #FFEDD5 60%, #FDE8D7 100%);
    min-height: 100vh;
    padding: 24px 16px;
    color: #1F2937;
  }
  .container { max-width: 640px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 { font-size: 26px; color: #EA580C; letter-spacing: 1px; }
  header p { color: #78716C; font-size: 14px; margin-top: 6px; }
  .card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 22px 20px;
    box-shadow: 0 8px 24px rgba(234, 88, 12, 0.12);
  }
  .grid { display: flex; flex-wrap: wrap; gap: 14px 16px; }
  .field { flex: 1 1 260px; min-width: 0; }
  .age-field { flex: 1 1 120px; }
  label { display: block; font-size: 13px; font-weight: 600; color: #44403C; margin-bottom: 6px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1.5px solid #E7E5E4;
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus { border-color: #FB923C; box-shadow: 0 0 0 3px rgba(251, 146, 60, 0.18); }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    font-size: 16px;
    font-weight: 700;
    color: #FFFFFF;
    background: linear-gradient(135deg, #F97316, #EA580C);
    border: none;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.2s, filter 0.2s;
    box-shadow: 0 4px 14px rgba(234, 88, 12, 0.35);
  }
  button:hover { filter: brightness(1.06); box-shadow: 0 6px 18px rgba(234, 88, 12, 0.45); }
  button:active { transform: scale(0.98); }
  .error {
    display: none;
    margin-top: 14px;
    padding: 10px 14px;
    font-size: 14px;
    background: #FEF2F2;
    color: #DC2626;
    border: 1px solid #FECACA;
    border-radius: 10px;
  }
  .result {
    display: none;
    margin-top: 20px;
    text-align: center;
    background: linear-gradient(135deg, #FFF7ED, #FFEDD5);
    border: 2px solid #FDBA74;
    border-radius: 16px;
    padding: 24px 16px;
  }
  .result .big { font-size: 56px; font-weight: 800; color: #EA580C; line-height: 1.1; }
  .result .big span { font-size: 26px; }
  .result .status { margin-top: 8px; font-size: 17px; font-weight: 700; color: #1F2937; }
  .result .detail {
    margin-top: 14px;
    font-size: 12.5px;
    color: #78716C;
    line-height: 1.9;
    text-align: left;
    background: rgba(255, 255, 255, 0.72);
    border-radius: 10px;
    padding: 10px 14px;
  }
  .result.danger { border-color: #F87171; background: linear-gradient(135deg, #FEF2F2, #FEE2E2); }
  .result.danger .big { color: #DC2626; }
  .result.good { border-color: #86EFAC; background: linear-gradient(135deg, #F0FDF4, #DCFCE7); }
  .result.good .big { color: #16A34A; }
  @media (max-width: 480px) {
    header h1 { font-size: 21px; }
    .result .big { font-size: 46px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>跑者无疆</h1>
  </header>

  <form id="calcForm" class="card" novalidate>
    <div class="grid">
      <div class="field age-field">
        <label for="age">年龄</label>
        <input type="number" id="age" min="1" max="120" step="1" placeholder="如 30">
      </div>
      <div class="field">
        <label for="duration">运动时长（分钟）</label>
        <input type="number" id="duration" min="1" step="0.1" placeholder="如 45">
      </div>
      <div class="field">
        <label for="actCal">活动卡路里（大卡）</label>
        <input type="number" id="actCal" min="0" step="1" placeholder="如 420">
      </div>
      <div class="field">
        <label for="totalCal">总卡路里（大卡）</label>
        <input type="number" id="totalCal" min="0" step="1" placeholder="如 2000">
      </div>
      <div class="field">
        <label for="pace">平均配速（分钟/公里）</label>
        <input type="number" id="pace" min="0" step="0.01" placeholder="如 5.30">
      </div>
      <div class="field">
        <label for="heartRate">平均心率（次/分钟）</label>
        <input type="number" id="heartRate" min="30" max="250" step="1" placeholder="如 165">
      </div>
      <div class="field">
        <label for="steps">步数（步）</label>
        <input type="number" id="steps" min="0" step="1" placeholder="如 8000">
      </div>
      <div class="field">
        <label for="up">累计上升（米）</label>
        <input type="number" id="up" min="0" step="1" placeholder="如 180">
      </div>
      <div class="field">
        <label for="down">累计下降（米）</label>
        <input type="number" id="down" min="0" step="1" placeholder="如 180">
      </div>
      <div class="field">
        <label for="alt">平均海拔（米）</label>
        <input type="number" id="alt" min="0" step="1" placeholder="如 120">
      </div>
    </div>

    <button type="submit">计算极限百分比</button>
    <div class="error" id="errorMsg"></div>
  </form>

  <div class="result" id="result">
    <div class="big"><span id="pctNum">85</span><span>%</span></div>
    <div class="status" id="statusText">接近极限，建议减速</div>
    <div class="detail" id="detailText"></div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var labels = {
    age: '年龄', duration: '运动时长', actCal: '活动卡路里', totalCal: '总卡路里',
    pace: '平均配速', heartRate: '平均心率', steps: '步数', up: '累计上升', down: '累计下降', alt: '平均海拔'
  };

  function clamp(v, min, max) {
    if (isNaN(v)) return 0;
    return Math.min(max, Math.max(min, v));
  }

  var form = document.getElementById('calcForm');
  var errorMsg = document.getElementById('errorMsg');
  var resultBox = document.getElementById('result');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
    resultBox.style.display = 'none';
  }

  function showResult(total, parts) {
    errorMsg.style.display = 'none';

    document.getElementById('pctNum').textContent = Math.round(total);

    var status, cls;
    if (total >= 90) { status = '已达极限，注意安全！'; cls = 'danger'; }
    else if (total >= 75) { status = '接近极限，建议减速'; cls = ''; }
    else if (total >= 60) { status = '状态良好，还有余力'; cls = 'good'; }
    else { status = '强度适中，比较轻松'; cls = 'good'; }

    document.getElementById('statusText').textContent = status;
    resultBox.className = 'result' + (cls ? ' ' + cls : '');

    document.getElementById('detailText').innerHTML =
      '心率负荷 ' + Math.round(parts.hr) + ' 分（权重 40%）<br>' +
      '卡路里强度 ' + Math.round(parts.cal) + ' 分（权重 25%）<br>' +
      '爬升与海拔 ' + Math.round(parts.elev) + ' 分（权重 20%）<br>' +
      '配速负荷 ' + Math.round(parts.pace) + ' 分（权重 10%）<br>' +
      '步频负荷 ' + Math.round(parts.cad) + ' 分（权重 5%）';

    resultBox.style.display = 'block';
    resultBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    // 1) 读取并校验：空值 / 非数字
    var values = {};
    for (var key in labels) {
      if (!labels.hasOwnProperty(key)) continue;
      var el = document.getElementById(key);
      var raw = el.value.trim();
      if (raw === '') { showError('请填写「' + labels[key] + '」！'); el.focus(); return; }
      var num = Number(raw);
      if (isNaN(num)) { showError('「' + labels[key] + '」不是有效数字，请检查。'); el.focus(); return; }
      values[key] = num;
    }

    // 2) 边界检查
    if (values.age < 1 || values.age > 120) { showError('年龄需要在 1–120 之间哦。'); return; }
    if (values.duration <= 0) { showError('运动时长必须大于 0。'); return; }
    if (values.heartRate < 30 || values.heartRate > 250) { showError('心率请填写 30–250 之间的数值。'); return; }
    if (values.totalCal <= 0) { showError('总卡路里需要大于 0。'); return; }
    if (values.pace < 0 || values.steps < 0 || values.actCal < 0 || values.up < 0 || values.down < 0 || values.alt < 0) {
      showError('卡路里、步数、海拔、爬升等不能填负数。'); return;
    }

    // 3) 各项得分（每一项都 clamp 到 0–100，防除零、防越界）

    // ① 心率负荷：平均心率 / 最大心率（220 - 年龄）。达到 90% 以上则接近满分。
    var maxHR = 220 - values.age;
    var hrScore = clamp(values.heartRate / maxHR * 100, 0, 100);

    // ② 卡路里强度：每分钟消耗（大卡/分钟），10 大卡/分钟视为高强；
    //    再叠加"活动卡路里占总卡路里比例"作辅助（80% 看强度，20% 看占比）。
    var calPerMin = values.actCal / values.duration;
    var calRatio = values.actCal / values.totalCal;
    var calScore = clamp(calPerMin / 10 * 100, 0, 100) * 0.8 + clamp(calRatio * 100, 0, 100) * 0.2;

    // ③ 爬升与海拔：净爬升速率（米/分钟，20 米/分钟视为高强）+ 平均海拔（3000 米视为满分）。
    //    下坡能耗约为上坡一半，所以用"上升 - 下降×0.5"计净爬升。
    var netClimb = values.up - values.down * 0.5;
    var climbScore = clamp(netClimb / values.duration / 20 * 100, 0, 100);
    var altScore = clamp(values.alt / 3000 * 100, 0, 100);
    var elevScore = climbScore * 0.7 + altScore * 0.3;

    // ④ 配速负荷：5 分钟/公里视为满分基准，配速越快分越高。
    var paceScore = values.pace > 0 ? clamp(5 / values.pace * 100, 0, 100) : 0;

    // ⑤ 步频负荷：180 步/分钟视为满分基准。
    var cadence = values.steps / values.duration;
    var cadScore = clamp(cadence / 180 * 100, 0, 100);

    // 4) 综合：权重合计 = 1.0，封顶 100%
    var total = clamp(
      0.40 * hrScore + 0.25 * calScore + 0.20 * elevScore + 0.10 * paceScore + 0.05 * cadScore,
      0, 100
    );

    showResult(total, { hr: hrScore, cal: calScore, elev: elevScore, pace: paceScore, cad: cadScore });
  });
})();
</script>
</body>
</html>
